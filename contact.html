        <!-- お問い合わせゾーン -->
        <div class="contact-zone">

                <label for="name">名前</label>
                <input type="text" id="name" name="name" required>

                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="email" required>

                <label for="message">メッセージ</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">送信</button>
            </form>
        </div>

        <!-- 画像ゾーン -->
        <div class="image-zone">
            <img src="https://github.com/haruto0227/about-me/blob/main/Image%20(2).jpg?raw=true" alt="お問い合わせイメージ" id="contact-image">
        </div>
    </div>

    <script>
        // 画像のURLを動的に変更する場合
        const contactImage = document.getElementById('contact-image');
        const imageUrl = "img/Image (2).jpg"; // ここに画像のURLを指定
        contactImage.src = imageUrl;

        // フォーム送信のサンプル（JavaScriptでフォームの動作を管理可能）
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault(); // フォームのデフォルト送信を停止
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            // 送信内容をコンソールに表示（実際はここでサーバーに送信するコードを追加）
            console.log('名前:', name);
            console.log('メールアドレス:', email);
            console.log('メッセージ:', message);
            
            alert('お問い合わせ内容を送信しました！');
        });
    </script>
